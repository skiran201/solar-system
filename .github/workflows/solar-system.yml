name: solar-system-workflows
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - feature/*
env:
    MONGO_URI: mongodb://127.0.0.1:27017/superData
    MONGO_USERNAME: saikiran
    MONGO_PASSWORD: saikiran
jobs:
    unit-testing:
        services:
        # Use a simple, descriptive name (e.g., 'mongo').
        # This name becomes the HOSTNAME your application must use.
            mongo:
                image: mongo:latest
                ports:
                # Map the internal Mongo port (27017) to the runner.
                # NOTE: You don't usually need this explicit port mapping for access
                # from the job steps, but it's good practice.
                    - 27017:27017
                options: >-
                    --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                env:
                    # Required if you need authentication
                    MONGO_INITDB_DATABASE: superData
                    MONGO_INITDB_ROOT_USERNAME: saikiran
                    MONGO_INITDB_ROOT_PASSWORD: saikiran
            mongo-db:
                image: mongo:latest
                ports:
                    - 27018:27017
        env:
              # Required if you need authentication
              MONGO_URI: mongodb://localhost:27018/superData
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password

        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup NodeJS Version - 18
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Cache npm dependencies
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm install

            - name: Run unit tests
              id: unit-test-step
              run: |
                    # 1. Install netcat-openbsd (the specific package)
                    # We update first, then install the package that provides 'nc'
                    sudo apt-get update
                    sudo apt-get install -y netcat-openbsd
                    
                    # 2. Loop until the port is listening
                    i=0
                    # We check the 'mongo' hostname on port 27017
                    while ! nc -z -w 1 127.0.0.1 27017 && [ $i -lt 12 ]; do
                        i=$((i+1))
                        echo "Waiting for MongoDB port 27017... Attempt $i of 12"
                        sleep 5
                    done
                    
                    # 3. Check for timeout
                    if [ $i -eq 12 ]; then
                        echo "MongoDB port never became available on 127.0.0.1:27017"
                        exit 1
                    fi
                    
                    echo "MongoDB is ready and accessible via 127.0.0.1:27017! Running tests now."
                    npm test -- --verbose
              continue-on-error: true

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: ./test-results.xml
                retention-days: 5

    code-coverage:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup NodeJS Version - 18
              uses: actions/setup-node@v3
              with:
                  node-version: 18


            - name: Cache npm dependencies
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
            
            - name: Install dependencies
              run: npm install

            - name: Check code coverage
              run: npm run coverage
              continue-on-error: true

            - name: Archive code coverage results
              uses: actions/upload-artifact@v4
              with:
                name: Code-Coverage-Result
                path: ./coverage
                retention-days: 5

    docker:
        runs-on: ubuntu-latest
        needs: [unit-testing, code-coverage]
        permissions:
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: GHCR login
              uses: docker/login-action@v2
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build docker image
              uses: docker/build-push-action@v4
              with:
                context: .
                push: false
                tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            - name: Docker image test
              run: |
                docker images
                docker run --name solar-system-test -d -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

                export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-test)
                echo "Container IP Address: $IP"
                echo "Testing application endpoint..."
                wget -qO- 127.0.0.1:3000/live | grep live

            - name: Container Registry Push
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                tags: | 
                  ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
                  ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}