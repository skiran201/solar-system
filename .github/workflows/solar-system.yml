name: solar-system-workflow
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - feature/*
env:
    MONGO_URI: mongodb://mongo:27017/solar-system
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ vars.MONGO_PASSWORD }}
jobs:
    unit-testing:
        services:
        # Use a simple, descriptive name (e.g., 'mongo').
        # This name becomes the HOSTNAME your application must use.
            mongo:
                image: mongo:latest
                ports:
                # Map the internal Mongo port (27017) to the runner.
                # NOTE: You don't usually need this explicit port mapping for access
                # from the job steps, but it's good practice.
                    - 27017/tcp
                options: >-
                    --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                env:
                    # Required if you need authentication
                    MONGO_INITDB_ROOT_USERNAME: saikiran
                    MONGO_INITDB_ROOT_PASSWORD: saikiran
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup NodeJS Version - 18
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Run unit tests
              run: |
                    # Wait for the service to report 'healthy' status
                    i=0
                    while [ "$(docker inspect --format='{{.State.Health.Status}}' mongo)" != "healthy" ] && [ $i -lt 12 ]; do
                        i=$((i+1))
                        echo "Waiting for MongoDB health check... Attempt $i of 12"
                        sleep 5
                    done
                    
                    if [ $i -eq 12 ]; then
                        echo "MongoDB service did not become healthy within the timeout."
                        exit 1
                    fi
                    echo "MongoDB is fully healthy!"
                    npm test